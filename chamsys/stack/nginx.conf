# MantisBT is not a front-controller app: serve files directly and hand .php to php-fpm.
# The deny rules reproduce the shipped .htaccess ones, which nginx does not read.
server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    client_max_body_size 16M;

    location ~ ^/(\.git|config|core|library|lang|plugins|scripts|vendor|docbook|tests|chamsys)(/|$) {
        return 404;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # The REST API is a Slim app behind api/rest/index.php.
    location /api/rest/ {
        try_files $uri /api/rest/index.php$is_args$args;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
